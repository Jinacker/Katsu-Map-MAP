<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>돈가스 지도</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<style>
html,
body {
width: 100%;
height: 100%;
margin: 0;
padding: 0;
overflow: hidden;
-webkit-tap-highlight-color: transparent;
}

#map {
width: 100%;
height: 100%;
margin: 0;
padding: 0;
overflow: hidden;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   옵션: CSS Transform Scale 확대 (더 강력한 확대 필요 시)
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

   아래 주석을 해제하면 지도 전체가 1.3배 확대됩니다.
   - 장점: 도로, 글자, 아이콘 모두 선명하게 확대
   - 단점: 지도 가장자리가 잘릴 수 있음

   필요시 scale(1.3)을 scale(1.5) 등으로 조정 가능
*/

/*
#map > div {
transform: scale(1.3);
transform-origin: center center;
width: calc(100% / 1.3);
height: calc(100% / 1.3);
}
*/

/*
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  POI 및 라벨 숨기기 전략
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  Kakao Maps API는 POI를 완전히 제거하는 공식 방법이 없습니다.
  지도 타일 자체에 POI가 렌더링되어 있기 때문입니다.

  하지만 CSS로 DOM에 추가되는 라벨 요소들을 숨길 수 있습니다:
  - .label: POI 라벨 텍스트
  - .info: 정보창
  - .txt_*: 각종 텍스트 클래스

  Kakao는 지도 위에 SVG/Canvas로 라벨을 그리거나,
  absolute position의 div로 라벨을 추가합니다.
  이를 모두 숨기기 위해 다양한 선택자를 사용합니다.
*/

/* 1단계: 기본 POI 라벨 클래스 숨기기 */
#map .label,
#map .info,
#map .txt_name,
#map .txt_caption,
#map .txt_sub {
display: none !important;
visibility: hidden !important;
}

/* 2단계: 지도 위의 텍스트 요소 숨기기 (드래그 레이어는 보호) */
/* Kakao 지도는 absolute position div 안에 span/div로 라벨을 추가합니다 */
/* 주의: 너무 공격적으로 숨기면 드래그가 안될 수 있음 */

/* 3단계: POI 아이콘과 심볼 숨기기 */
#map .icon,
#map .symbol {
display: none !important;
}

/* 4단계: Kakao 로고와 저작권은 유지 (법적 요구사항) */
#map .map_copyright,
#map .map_logo {
display: block !important;
visibility: visible !important;
}

/* 5단계: 컨트롤러는 유지 */
#map .control,
#map .controller {
display: block !important;
}
</style>
<!-- config.js에서 API 키 로드 (로컬 개발용) -->
<!-- React Native WebView에서는 injectedJavaScript로 주입 -->
<script src="config.js"></script>
</head>

<body>
<div id="map"></div>

<script>
// Kakao SDK 동적 로드 (환경변수 사용)
(function() {
const API_KEY = window.KAKAO_MAP_JS_KEY;

if (!API_KEY) {
console.error('❌ API 키가 설정되지 않았습니다. config.js 파일을 확인하세요.');
document.getElementById('map').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666;">API 키가 설정되지 않았습니다.</div>';
return;
}

console.log('🔑 API Key loaded:', API_KEY.substring(0, 10) + '...');

const script = document.createElement('script');
script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${API_KEY}&autoload=false`;
script.onload = function() {
console.log('✅ Kakao SDK script loaded successfully');
kakao.maps.load(() => {
console.log('✅ kakao.maps.load() called');
try {
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   지도 초기화
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

// URL 파라미터 파싱 함수
const getQueryParam = (name) => new URLSearchParams(window.location.search).get(name);

// 권역과 구 매핑 (서울 25개 구 전체)
const REGION_MAPPING = {
  '강북성신': ['성북구', '종로구'],
  '동대문': ['동대문구', '중랑구'],
  '성동': ['성동구','광진구'],
  '홍대': ['마포구', '서대문구'],
  '마포': ['마포구', '은평구'],
  '용산이태원': ['용산구','중구'],
  '광진': ['성동구','광진구'],
  '영등포여의도': ['영등포구', '양천구', '강서구', '구로구'],
  '서초강남': ['서초구', '강남구', '동작구', '관악구'],
  '송파': ['송파구', '강동구']
};

// 권역별 중심 좌표 및 줌 레벨 (구 개수에 따라 레벨 조정: 많을수록 넓게)
const REGION_CENTERS = {
  '강북성신': { lat: 37.6150, lng: 127.0000, level: 8 },  // 성북구+종로구+강북구 (3개구)
  '동대문': { lat: 37.5950, lng: 127.0650, level: 7 },    // 동대문구+중랑구 (2개구)
  '성동': { lat: 37.5500, lng: 127.0600, level: 7 },      // 성동구+광진구 (2개구)
  '홍대': { lat: 37.5700, lng: 126.9300, level: 7 },      // 마포구+서대문구 (2개구)
  '마포': { lat: 37.6000, lng: 126.9200, level: 7 },      // 마포구+은평구 (2개구)
  '용산이태원': { lat: 37.5450, lng: 126.9900, level: 7 }, // 용산구+중구 (2개구)
  '광진': { lat: 37.5450, lng: 127.0800, level: 7 },      // 성동구+광진구 (2개구)
  '영등포여의도': { lat: 37.5300, lng: 126.8600, level: 8 }, // 영등포+양천+강서+구로 (4개구)
  '서초강남': { lat: 37.4800, lng: 127.0100, level: 8 },  // 서초+강남+동작+관악 (4개구)
  '송파': { lat: 37.5300, lng: 127.1400, level: 7 }       // 송파구+강동구 (2개구)
};

// URL 파라미터로 권역 설정 (예: ?region=강남)
const urlRegion = getQueryParam("region");
const urlLat = parseFloat(getQueryParam("lat"));
const urlLng = parseFloat(getQueryParam("lng"));

let initialLat, initialLng, initialLevel;

if (urlRegion && REGION_CENTERS[urlRegion]) {
  // 권역이 지정된 경우 해당 권역 중심으로 이동
  const regionCenter = REGION_CENTERS[urlRegion];
  initialLat = regionCenter.lat;
  initialLng = regionCenter.lng;
  initialLevel = 8; // 권역 시점이동 시 무조건 2km (level 8)
} else {
  // 권역이 없으면 기본 서울 중심 또는 URL 좌표 사용
  initialLat = isNaN(urlLat) ? 37.5665 : urlLat;
  initialLng = isNaN(urlLng) ? 126.9780 : urlLng;
  initialLevel = 2; // 기본 줌 레벨
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   모바일 최적화: 지도 요소 확대
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

   방법 1: CSS transform scale (권장)
   - 장점: 간단하고 빠름, 모든 요소가 비례적으로 확대됨
   - 단점: 좌표 계산 시 scale 보정 필요

   방법 2: 낮은 level + 작은 컨테이너
   - level을 낮춰서 지도를 확대하고, 컨테이너 크기로 조절
   - Kakao의 기본 방식이라 안정적
*/

// 모바일 최적화를 위한 줌 레벨 조정
// level 값이 낮을수록 더 확대됨 (1: 최대 확대, 14: 최대 축소)
const map = new kakao.maps.Map(document.getElementById("map"), {
center: new kakao.maps.LatLng(initialLat, initialLng),
level: initialLevel, // URL 파라미터 또는 기본 레벨 사용
draggable: true, // 드래그 이동 활성화
scrollwheel: true, // 마우스 휠 줌 활성화
disableDoubleClick: false, // 더블클릭 줌 활성화
disableDoubleClickZoom: false, // 더블클릭 줌 활성화
});

// 전역 객체로 저장
window.map = map;
window.markers = [];

// 줌 레벨 제한 설정 (최대 2km까지만 축소 가능)
map.setMaxLevel(8); // level 8 = 2km 범위

console.log("✅ Kakao Map Initialized (Mobile Optimized, Max 2km range)");

// 지도 초기화가 완료된 후 relayout 실행
    setTimeout(() => {
    map.relayout();
    console.log("✅ Map relayout completed");
    }, 100);

    // --- 내 위치 표시 기능 추가 ---
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const myPosition = new kakao.maps.LatLng(lat, lng);

                // 내 위치 마커 SVG (그림자 포함된 빨간색 원)
                const svg = `
                  <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
                    <defs>
                      <filter id="dropshadow" height="1.5" width="1.5" x="-0.25" y="-0.25">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
                        <feOffset in="blur" dx="1" dy="2" result="offsetBlur"/>
                        <feFlood flood-color="#000" flood-opacity="0.4" result="offsetColor"/>
                        <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetBlur"/>
                        <feMerge>
                          <feMergeNode in="offsetBlur"/>
                          <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                      </filter>
                    </defs>
                    <circle cx="16" cy="16" r="10" fill="#E74C3C" stroke="#FFFFFF" stroke-width="3" filter="url(#dropshadow)"/>
                  </svg>
                `;
                const imageUrl = `data:image/svg+xml;base64,${window.btoa(unescape(encodeURIComponent(svg)))}`;
                const imageSize = new kakao.maps.Size(36, 36);
                const imageOptions = { offset: new kakao.maps.Point(18, 18) };
                const myLocationMarkerImage = new kakao.maps.MarkerImage(imageUrl, imageSize, imageOptions);

                // 마커를 생성하고 지도에 표시합니다.
                new kakao.maps.Marker({
                    position: myPosition,
                    map: window.map,
                    image: myLocationMarkerImage,
                    zIndex: 1000 // 다른 마커들보다 항상 위에 있도록 z-index를 높게 설정
                });
                console.log(`✅ 내 위치(${lat.toFixed(4)}, ${lng.toFixed(4)})에 핀을 추가했습니다.`);
            },
            (error) => {
                console.warn('⚠️ 내 위치를 가져오는 데 실패했습니다.', error);
            },
            { enableHighAccuracy: true }
        );
    } else {
        console.warn('⚠️ 이 브라우저에서는 Geolocation을 지원하지 않습니다.');
    }
    // --- 내 위치 표시 기능 끝 ---
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   서울 구 경계선 표시
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

// seoul-polygons.js를 동적으로 로드 (Kakao SDK 로드 후)
const polygonScript = document.createElement('script');
polygonScript.src = 'seoul-polygons.js';
polygonScript.onload = function() {
  // seoulDistricts는 seoul-polygons.js에서 로드됨
  if (typeof seoulDistricts !== 'undefined') {
    // 권역 필터링: URL에 region 파라미터가 있으면 해당 권역의 구들만 표시
    const allowedDistricts = urlRegion && REGION_MAPPING[urlRegion]
      ? REGION_MAPPING[urlRegion]
      : null; // null이면 모든 구 표시

    let displayedCount = 0;
    const regionPaths = []; // 권역에 포함된 구들의 경계 저장

    seoulDistricts.forEach(district => {
      // 권역 필터링 적용
      if (allowedDistricts && !allowedDistricts.includes(district.name)) {
        return; // 이 구는 건너뜀
      }

      // 좌표 배열을 kakao.maps.LatLng 객체로 변환
      const path = district.path.map(coord => new kakao.maps.LatLng(coord[0], coord[1]));

      // 권역 경로에 추가 (오버레이용)
      regionPaths.push(path);

      // 폴리곤 생성 (테두리만 표시)
      const polygon = new kakao.maps.Polygon({
        map: map,
        path: path,
        strokeWeight: 4,           // 테두리 두께
        strokeColor: '#FB8C00',    // 테두리 색상 (진한 오렌지)
        strokeOpacity: 0.8,        // 테두리 투명도
        strokeStyle: 'solid',      // 테두리 스타일
        fillColor: 'transparent',  // 채우기 색상 없음
        fillOpacity: 0             // 채우기 투명도 0
      });

      displayedCount++;
    });

    // 권역이 선택된 경우, 외부 영역을 어둡게 처리
    if (urlRegion && regionPaths.length > 0) {
      // 서울과 경기도 전체를 덮는 큰 사각형 (외곽 경계 - 더 넓게 확장)
      const outerBounds = [
        new kakao.maps.LatLng(38.2000, 126.4000), // 북서
        new kakao.maps.LatLng(38.2000, 127.7000), // 북동
        new kakao.maps.LatLng(37.2000, 127.7000), // 남동
        new kakao.maps.LatLng(37.2000, 126.4000), // 남서
        new kakao.maps.LatLng(38.2000, 126.4000)  // 북서 (닫기)
      ];

      // 오버레이 폴리곤: 외곽 사각형에서 권역 구들을 뺀 영역
      const overlayPath = [outerBounds, ...regionPaths];

      const overlayPolygon = new kakao.maps.Polygon({
        map: map,
        path: overlayPath,
        strokeWeight: 0,
        strokeOpacity: 0,
        fillColor: '#000000',      // 검은색 오버레이
        fillOpacity: 0.3         // 30% 투명도 (더 은은하게)
      });

      console.log(`✅ 권역 외부 오버레이 적용 완료`);
    }

    if (urlRegion) {
      console.log(`✅ [${urlRegion}] ${displayedCount}개 구 경계선 표시 완료`);
    } else {
      console.log(`✅ 서울 ${displayedCount}개 구 경계선 표시 완료`);
    }
  } else {
    console.warn('⚠️ seoulDistricts 변수를 찾을 수 없습니다.');
  }
};
polygonScript.onerror = function() {
  console.error('❌ seoul-polygons.js 로드 실패');
};
document.head.appendChild(polygonScript);

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   POI 동적 제거 (MutationObserver 사용)
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

   Kakao Maps는 지도 이동/줌 시 POI 라벨을 동적으로 DOM에 추가합니다.
   CSS만으로는 미리 숨길 수 없는 요소들을 제거하기 위해
   MutationObserver를 사용하여 DOM 변경을 감지하고 즉시 제거합니다.

   지도 초기화가 완전히 끝난 후에 시작하여 드래그 기능 보호
*/

const mapElement = document.getElementById('map');

// POI 제거 함수
const removePOIElements = () => {
// 라벨 클래스를 가진 모든 요소 제거
const labels = mapElement.querySelectorAll('.label, .info, .txt_name, .txt_caption, .txt_sub');
labels.forEach(el => {
if (el && el.parentNode) {
el.style.display = 'none';
el.style.visibility = 'hidden';
}
});

// absolute position div 내의 span 제거 (POI 텍스트)
const textElements = mapElement.querySelectorAll('div[style*="position: absolute"] span');
textElements.forEach(el => {
// Kakao 로고나 저작권 정보가 아닌 경우만 제거
if (!el.closest('.map_copyright') && !el.closest('.map_logo')) {
el.style.display = 'none';
}
});
};

// MutationObserver 디바운싱 (드래그 성능 최적화)
let poiRemovalTimeout;
const debouncedRemovePOI = () => {
clearTimeout(poiRemovalTimeout);
poiRemovalTimeout = setTimeout(() => {
removePOIElements();
}, 100); // 100ms 디바운스
};

// MutationObserver 설정
const observer = new MutationObserver((mutations) => {
// DOM 변경 감지 시 디바운스된 POI 제거
debouncedRemovePOI();
});

// 지도 초기화 완료 후 관찰 시작 (드래그 기능 보호)
setTimeout(() => {
observer.observe(mapElement, {
childList: true,      // 자식 요소 추가/제거 감지
subtree: true,        // 모든 하위 요소 감지
attributes: false,    // 속성 변경은 무시 (성능 최적화)
});

// 초기 실행
removePOIElements();
console.log("✅ POI 제거 시작");
}, 500); // 지도 초기화 후 500ms 대기

// 지도 이벤트 발생 시에도 POI 제거 실행
kakao.maps.event.addListener(map, 'idle', () => {
// idle: 지도 이동/줌 완료 후 발생
removePOIElements();
});

// 드래그 시작 시 POI 제거 일시 중지 (성능 최적화)
let isDragging = false;
kakao.maps.event.addListener(map, 'dragstart', () => {
isDragging = true;
});

kakao.maps.event.addListener(map, 'dragend', () => {
isDragging = false;
removePOIElements();
});

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   React Native WebView 통신 및 마커 업데이트
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

// --- 전역 상태 변수 ---
let currentRestaurants = []; // 현재 표시된 맛집 목록
let selectedRestaurantLatLng = null; // 사용자가 선택한 맛집의 좌표
const markerPinImageCache = {}; // 핀 마커 이미지 캐시
const markerShadowImageCache = {}; // 그림자 마커 이미지 캐시

// --- 마커 속성 정의 ---
const levelProperties = {
  top5:   { color: '#B56EFF', zIndex: 4 },
  best:   { color: '#5CC8FF', zIndex: 3 },
  good:   { color: '#FF7A3D', zIndex: 2 },
  normal: { color: '#FFD08A', zIndex: 1 },
  default:{ color: '#888888', zIndex: 0 }
};

// --- 마커 SVG 및 이미지 생성 ---

// 그림자 SVG 생성
const getMarkerShadowSvg = () => {
  return `
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
      <g transform="translate(2, 2)">
        <ellipse cx="14" cy="33" rx="8" ry="3" fill="#000" opacity="0.25"/>
      </g>
    </svg>
  `;
};

// 핀 SVG 생성
const getMarkerPinSvg = (color, isSelected = false, isFavorite = false) => {
  let stroke = '';
  if (isSelected) {
    stroke = 'stroke="#E74C3C" stroke-width="3"'; // 선택된 핀은 빨간색 테두리
  } else if (isFavorite) {
    stroke = 'stroke="#FFC700" stroke-width="3"'; // 즐겨찾기 핀은 노란색 테두리
  }
  return `
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
      <g transform="translate(2, 2)">
        <path fill="${color}" d="M14 0C8.486 0 4 4.486 4 10c0 8.75 10 20 10 20s10-11.25 10-20C24 4.486 19.514 0 14 0Z" ${stroke}/>
        <circle fill="#FFF" cx="14" cy="10" r="4" />
      </g>
    </svg>
  `;
};

// 그림자 이미지 생성 및 캐싱
const getMarkerShadowImage = () => {
  if (markerShadowImageCache.image) {
    return markerShadowImageCache.image;
  }
  const svg = getMarkerShadowSvg();
  const imageUrl = `data:image/svg+xml;base64,${window.btoa(unescape(encodeURIComponent(svg)))}`;
  const imageSize = new kakao.maps.Size(32, 40);
  const imageOptions = { offset: new kakao.maps.Point(16, 38) };
  const markerImage = new kakao.maps.MarkerImage(imageUrl, imageSize, imageOptions);
  markerShadowImageCache.image = markerImage;
  return markerImage;
};

// 핀 이미지 생성 및 캐싱
const getMarkerPinImage = (level, isSelected = false, isFavorite = false) => {
  const props = levelProperties[level] || levelProperties.default;
  const color = props.color;
  const cacheKey = `${color}-${isSelected}-${isFavorite}`; // isFavorite도 캐시 키에 포함

  if (markerPinImageCache[cacheKey]) {
    return markerPinImageCache[cacheKey];
  }

  const svg = getMarkerPinSvg(color, isSelected, isFavorite);
  const imageUrl = `data:image/svg+xml;base64,${window.btoa(unescape(encodeURIComponent(svg)))}`;
  const imageSize = new kakao.maps.Size(32, 40);
  const imageOptions = { offset: new kakao.maps.Point(16, 38) };

  const markerImage = new kakao.maps.MarkerImage(imageUrl, imageSize, imageOptions);
  markerPinImageCache[cacheKey] = markerImage;
  return markerImage;
};

// --- 마커 업데이트 ---

// 마커를 다시 그리는 함수
const updateMarkers = (restaurants) => {
  if (!window.map) return;

  window.markers.forEach(marker => marker.setMap(null));
  window.markers = [];

  // 그림자를 먼저 모두 그립니다 (레이어 최하단)
  restaurants.forEach(restaurant => {
    if (restaurant.lat == null || restaurant.lng == null) return;
    
    const shadowImage = getMarkerShadowImage();
    const shadowMarker = new kakao.maps.Marker({
      map: window.map,
      position: new kakao.maps.LatLng(restaurant.lat, restaurant.lng),
      image: shadowImage,
      zIndex: 0 // 그림자는 항상 zIndex 0
    });
    window.markers.push(shadowMarker);
  });

  // 그 다음 핀을 그립니다
  restaurants.forEach(restaurant => {
    if (restaurant.lat == null || restaurant.lng == null) return;

    const isSelected = selectedRestaurantLatLng && restaurant.lat === selectedRestaurantLatLng.lat && restaurant.lng === selectedRestaurantLatLng.lng;
    const isFavorite = restaurant.isFavorite || false; // isFavorite 속성 추가
    const props = levelProperties[restaurant.recommendLevel] || levelProperties.default;
    const markerImage = getMarkerPinImage(restaurant.recommendLevel, isSelected, isFavorite);

    const marker = new kakao.maps.Marker({
      map: window.map,
      position: new kakao.maps.LatLng(restaurant.lat, restaurant.lng),
      image: markerImage,
      // 그림자 zIndex가 0이므로, 핀은 1부터 시작, 선택 시 999
      zIndex: isSelected ? 999 : (props.zIndex + 1)
    });

    // 마커 클릭 이벤트 추가
    kakao.maps.event.addListener(marker, 'click', () => {
        // 1. 핀 클릭 시 시점 이동 (레벨 5 이상일 때만)
        const currentLevel = window.map.getLevel();
        if (currentLevel >= 5) { // 레벨 5부터 시점 이동
            selectedRestaurantLatLng = { lat: restaurant.lat, lng: restaurant.lng };
            window.map.setLevel(4); // 요청: 확대 레벨 4로 변경
            window.map.setCenter(new kakao.maps.LatLng(restaurant.lat, restaurant.lng));
            updateMarkers(currentRestaurants); // 강조 및 중앙 정렬
            console.log(`🗺️ 핀 클릭 시 시점 이동: ${restaurant.name}`);
        } else {
            // 레벨 4 이하는 시점 이동 없이 강조만
            if (!selectedRestaurantLatLng || selectedRestaurantLatLng.lat !== restaurant.lat || selectedRestaurantLatLng.lng !== restaurant.lng) {
                selectedRestaurantLatLng = { lat: restaurant.lat, lng: restaurant.lng };
                updateMarkers(currentRestaurants);
                console.log(`🗺️ 핀 클릭 시 강조: ${restaurant.name} (레벨 ${currentLevel}로 시점 이동 안함)`);
            }
        }

        // 2. RN으로 메시지 전송 (기존 로직)
        if (window.ReactNativeWebView) {
            const message = {
                type: 'SHOW_DIRECTIONS',
                payload: restaurant
            };
            window.ReactNativeWebView.postMessage(JSON.stringify(message));
            console.log('🗺️ 길찾기 요청:', restaurant.name);
        } else {
            console.error('클릭 오류: window.ReactNativeWebView 객체를 찾을 수 없습니다. RN WebView 설정이 올바른지 확인해주세요.');
        }
    });

    window.markers.push(marker);
  });

  console.log(`✅ ${restaurants.length * 2}개의 마커(핀+그림자)를 지도에 표시했습니다. (선택된 핀: ${selectedRestaurantLatLng ? '있음' : '없음'})`);
};

// --- WebView 메시지 핸들러 ---

const handleMessage = (event) => {
  try {
    const eventData = event.data;
    if (typeof eventData !== 'string') return;

    const message = JSON.parse(eventData);

    if (message.type === 'UPDATE_RESTAURANTS' && Array.isArray(message.payload)) {
      console.log(`📦 [WebView] ${message.payload.length}개의 레스토랑 데이터 수신`);
      currentRestaurants = message.payload;
      selectedRestaurantLatLng = null;
      updateMarkers(currentRestaurants);
    }
    else if (message.type === 'PAN_TO' && message.payload) {
      console.log(`🗺️ [WebView] 시점 이동 요청:`, message.payload);
      const { lat, lng, level } = message.payload;

      if (lat != null && lng != null && window.map) {
        selectedRestaurantLatLng = { lat, lng };

        window.map.setCenter(new kakao.maps.LatLng(lat, lng));
        if (level != null) {
          window.map.setLevel(level);
        }
        updateMarkers(currentRestaurants);
        
        console.log(`✅ [WebView] 시점 이동 및 핀 강조 완료!`);
      }
    }
  } catch (e) {
    // console.error('메시지 처리 중 오류:', e);
  }
};

// --- 이벤트 리스너 등록 ---
if (window.messageListener) {
    document.removeEventListener('message', window.messageListener);
    window.removeEventListener('message', window.messageListener);
}
window.messageListener = handleMessage;
document.addEventListener('message', window.messageListener);
window.addEventListener('message', window.messageListener); // 웹 테스트용

console.log('✅ [WebView] 새로운 React Native 메시지 리스너가 준비되었습니다.');

} catch (err) {
console.error("❌ 지도 초기화 중 오류 발생:", err);
}
});
};

script.onerror = function(e) {
console.error('❌ Kakao SDK 로드 실패');
console.error('Error details:', e);
console.error('Script src:', script.src);
};

document.head.appendChild(script);
})();
</script>
</body>
</html>
