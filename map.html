<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>돈가스 지도</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<style>
html,
body {
width: 100%;
height: 100%;
margin: 0;
padding: 0;
overflow: hidden;
-webkit-tap-highlight-color: transparent;
}

#map {
width: 100%;
height: 100%;
margin: 0;
padding: 0;
overflow: hidden;
position: relative; /* 오버레이를 위한 기준점 */
}

/* 블러 효과를 위한 오버레이 스타일 */
.blur-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30vmin; /* 1km 반경에 해당하는 크기 */
    height: 30vmin;
    border-radius: 50%;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.3); /* 바깥 영역을 어둡게 */
    backdrop-filter: blur(4px); /* 블러 효과 */
    -webkit-backdrop-filter: blur(4px); /* Safari 지원 */
    pointer-events: none; /* 지도 인터랙션 허용 */
    z-index: 1000;
}

/* 1km 반경 테두리 원 스타일 */
.circle-border-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30vmin;
    height: 30vmin;
    border-radius: 50%;
    border: 4px solid #FB8C00; /* 굵은 주황색 테두리 */
    pointer-events: none;
    z-index: 1001;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   POI 및 라벨 숨기기 전략 (기존 코드 유지)
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

/* 1단계: 기본 POI 라벨 클래스 숨기기 */
#map .label,
#map .info,
#map .txt_name,
#map .txt_caption,
#map .txt_sub {
display: none !important;
visibility: hidden !important;
}

/* 2단계: 지도 위의 텍스트 요소 숨기기 (기존 코드 유지) */
/* 3단계: POI 아이콘과 심볼 숨기기 */
#map .icon,
#map .symbol {
display: none !important;
}

/* 4단계: Kakao 로고와 저작권은 유지 (법적 요구사항) */
#map .map_copyright,
#map .map_logo {
display: block !important;
visibility: visible !important;
}

/* 5단계: 컨트롤러는 유지 */
#map .control,
#map .controller {
display: block !important;
}
</style>
<!-- config.js에서 API 키 로드 -->
<script src="config.js"></script>
</head>

<body>
<div id="map"></div>

<script>
(function() {
const API_KEY = window.KAKAO_MAP_JS_KEY;

if (!API_KEY) {
console.error('❌ API 키가 설정되지 않았습니다.');
document.getElementById('map').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666;">API 키가 설정되지 않았습니다.</div>';
return;
}

const script = document.createElement('script');
script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${API_KEY}&autoload=false`;
script.onload = function() {
kakao.maps.load(() => {
try {
const getQueryParam = (name) => new URLSearchParams(window.location.search).get(name);

const REGION_MAPPING = {
  '강북성신': ['성북구', '종로구'], '동대문': ['동대문구', '중랑구'], '성동': ['성동구','광진구'],
  '홍대': ['마포구', '서대문구'], '마포': ['마포구', '은평구'], '용산이태원': ['용산구','중구'],
  '광진': ['성동구','광진구'], '영등포여의도': ['영등포구', '양천구', '강서구', '구로구'],
  '서초강남': ['서초구', '강남구', '동작구', '관악구'], '송파': ['송파구', '강동구']
};

const REGION_CENTERS = {
  '강북성신': { lat: 37.6150, lng: 127.0000, level: 8 }, '동대문': { lat: 37.5950, lng: 127.0650, level: 7 },
  '성동': { lat: 37.5500, lng: 127.0600, level: 7 }, '홍대': { lat: 37.5700, lng: 126.9300, level: 7 },
  '마포': { lat: 37.6000, lng: 126.9200, level: 7 }, '용산이태원': { lat: 37.5450, lng: 126.9900, level: 7 },
  '광진': { lat: 37.5450, lng: 127.0800, level: 7 }, '영등포여의도': { lat: 37.5300, lng: 126.8600, level: 8 },
  '서초강남': { lat: 37.4800, lng: 127.0100, level: 8 }, '송파': { lat: 37.5300, lng: 127.1400, level: 7 }
};

const urlLat = parseFloat(getQueryParam("lat"));
const urlLng = parseFloat(getQueryParam("lng"));
const isLocationSearch = !isNaN(urlLat) && !isNaN(urlLng);
const urlRegion = getQueryParam("region");
const isViewAll = getQueryParam("viewAll") === 'true';

let initialLat, initialLng, initialLevel;
let mapOptions = { draggable: true, scrollwheel: true, disableDoubleClick: false, disableDoubleClickZoom: false };

if (isLocationSearch) {
    initialLat = urlLat;
    initialLng = urlLng;
    initialLevel = 6; // 1km 반경에 적절한 레벨 7
    mapOptions = { draggable: false, scrollwheel: false, disableDoubleClick: true, disableDoubleClickZoom: true }; // 지도 고정
    console.log(`[위치 검색 모드] 좌표 (${initialLat.toFixed(4)}, ${initialLng.toFixed(4)}) 중심으로 지도 고정`);
} else if (isViewAll) {
  initialLat = 37.5640; initialLng = 126.9900; initialLevel = 9;
} else if (urlRegion && REGION_CENTERS[urlRegion]) {
  const regionCenter = REGION_CENTERS[urlRegion];
  initialLat = regionCenter.lat; initialLng = regionCenter.lng; initialLevel = 8;
} else {
  initialLat = 37.5665; initialLng = 126.9780; initialLevel = 8;
}

const map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(initialLat, initialLng),
    level: initialLevel,
    ...mapOptions
});

window.map = map;
window.markers = [];

if (isLocationSearch) {
    const center = new kakao.maps.LatLng(initialLat, initialLng);

    const createEmojiMarkerImage = (emoji, size) => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const context = canvas.getContext('2d');
        context.font = `${size * 0.9}px sans-serif`;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(emoji, size / 2, size / 2 + size * 0.05);
        const imageUrl = canvas.toDataURL('image/png');
        return new kakao.maps.MarkerImage(imageUrl, new kakao.maps.Size(size, size), { offset: new kakao.maps.Point(size / 2, size / 2) });
    };

    new kakao.maps.Marker({
        position: center,
        map: map,
        image: createEmojiMarkerImage('📍', 30),
        zIndex: 1002
    });
    console.log('✅ 검색 위치 중심에 📍 핀을 추가했습니다.');

    const mapContainer = document.getElementById('map');
    const blurOverlay = document.createElement('div');
    blurOverlay.className = 'blur-overlay';
    mapContainer.appendChild(blurOverlay);
    
    const circleBorder = document.createElement('div');
    circleBorder.className = 'circle-border-overlay';
    mapContainer.appendChild(circleBorder);
    
    console.log('✅ 지도 외곽에 블러 및 원형 테두리 오버레이를 적용했습니다.');
}

map.setMaxLevel(isViewAll ? 13 : 8);

setTimeout(() => map.relayout(), 100);

// --- 내 위치 표시 기능 (기존 코드 유지) ---
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        (position) => {
            const myPosition = new kakao.maps.LatLng(position.coords.latitude, position.coords.longitude);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
                          <defs><filter id="dropshadow" height="1.5" width="1.5" x="-0.25" y="-0.25"><feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/><feOffset in="blur" dx="1" dy="2" result="offsetBlur"/><feFlood flood-color="#000" flood-opacity="0.4" result="offsetColor"/><feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetColor"/><feMerge><feMergeNode in="offsetColor"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
                          <circle cx="16" cy="16" r="10" fill="#E74C3C" stroke="#FFFFFF" stroke-width="3" filter="url(#dropshadow)"/></svg>`;
            const imageUrl = `data:image/svg+xml;base64,${window.btoa(unescape(encodeURIComponent(svg)))}`;
            new kakao.maps.Marker({
                position: myPosition,
                map: window.map,
                image: new kakao.maps.MarkerImage(imageUrl, new kakao.maps.Size(36, 36), { offset: new kakao.maps.Point(18, 18) }),
                zIndex: 1000
            });
            console.log(`✅ 내 위치(${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)})에 핀을 추가했습니다.`);
        },
        (error) => console.warn('⚠️ 내 위치를 가져오는 데 실패했습니다.', error),
        { enableHighAccuracy: true }
    );
} else {
    console.warn('⚠️ 이 브라우저에서는 Geolocation을 지원하지 않습니다.');
}

// --- 서울 구 경계선 표시 (isLocationSearch 아닐 때만) ---
if (!isLocationSearch) {
    const polygonScript = document.createElement('script');
    polygonScript.src = 'seoul-polygons.js';
    polygonScript.onload = function() {
        if (typeof seoulDistricts !== 'undefined') {
            const allowedDistricts = (!isViewAll && urlRegion && REGION_MAPPING[urlRegion]) ? REGION_MAPPING[urlRegion] : null;
            seoulDistricts.forEach(district => {
                if (allowedDistricts && !allowedDistricts.includes(district.name)) return;
                const path = district.path.map(coord => new kakao.maps.LatLng(coord[0], coord[1]));
                new kakao.maps.Polygon({
                    map: map, path: path, strokeWeight: 4, strokeColor: '#FB8C00',
                    strokeOpacity: 0.8, strokeStyle: 'solid', fillColor: 'transparent', fillOpacity: 0
                });
            });
        }
    };
    document.head.appendChild(polygonScript);
}

// 이하 기존 코드 (POI 제거, React Native 연동 등)는 동일하게 유지
const mapElement = document.getElementById('map');

const removePOIElements = () => {
    const labels = mapElement.querySelectorAll('.label, .info, .txt_name, .txt_caption, .txt_sub');
    labels.forEach(el => {
        if (el && el.parentNode) {
            el.style.display = 'none';
            el.style.visibility = 'hidden';
        }
    });
};

let poiRemovalTimeout;
const debouncedRemovePOI = () => {
    clearTimeout(poiRemovalTimeout);
    poiRemovalTimeout = setTimeout(removePOIElements, 50);
};

const observer = new MutationObserver(debouncedRemovePOI);
observer.observe(mapElement, { childList: true, subtree: true });
kakao.maps.event.addListener(map, 'idle', removePOIElements);

const handleMessage = (event) => {
  try {
    const eventData = event.data;
    if (typeof eventData !== 'string') return;

    const message = JSON.parse(eventData);

    if (message.type === 'UPDATE_RESTAURANTS' && Array.isArray(message.payload)) {
      console.log(`📦 [WebView] ${message.payload.length}개의 레스토랑 데이터 수신`);
      window.currentRestaurants = message.payload;
      window.selectedRestaurantLatLng = null;
    }
    else if (message.type === 'PAN_TO' && message.payload) {
      console.log(`🗺️ [WebView] 시점 이동 요청:`, message.payload);
      const { lat, lng, level } = message.payload;

      if (lat != null && lng != null && window.map) {
        window.selectedRestaurantLatLng = { lat, lng };

        window.map.setCenter(new kakao.maps.LatLng(lat, lng));
        if (level != null) {
          window.map.setLevel(level);
        }
        console.log(`✅ [WebView] 시점 이동 및 핀 강조 완료!`);
      }
    }
  } catch (e) {
    // console.error('메시지 처리 중 오류:', e);
  }
};

if (window.messageListener) {
    document.removeEventListener('message', window.messageListener);
    window.removeEventListener('message', window.messageListener);
}
window.messageListener = handleMessage;
document.addEventListener('message', window.messageListener);
window.addEventListener('message', window.messageListener); // 웹 테스트용

console.log('✅ [WebView] 새로운 React Native 메시지 리스너가 준비되었습니다.');

} catch (err) {
console.error("❌ 지도 초기화 중 오류 발생:", err);
}
});
};
script.onerror = () => console.error('❌ Kakao SDK 로드 실패');
document.head.appendChild(script);
})();
</script>
</body>
</html>
